name: lms

services:
  postgres:
    image: postgres:16-alpine
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms_password
      POSTGRES_DB: lms
    ports:
      - '5434:5432'
    volumes:
      - lms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lms -d lms']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: unless-stopped
    # Persist to disk so rate-limit / cache state survives a restart.
    command: redis-server --appendonly yes
    ports:
      - '6381:6379'
    volumes:
      - lms-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: lms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9004:9000' # S3 API
      - '9005:9001' # Web console (http://localhost:9005)
    volumes:
      - lms-miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every outbound email in development so nothing real is ever sent.
  # Inbox UI: http://localhost:8027
  mailpit:
    image: axllent/mailpit:latest
    container_name: lms-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1027:1025' # SMTP
      - '8027:8025' # Web UI (http://localhost:8027)

volumes:
  lms-pgdata:
  lms-redisdata:
  lms-miniodata:
